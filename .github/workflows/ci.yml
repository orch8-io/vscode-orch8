name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck + eslint + vitest + esbuild bundle + snippet drift check.
      # `npm run schema:check` is intentionally not run here: it diffs the
      # bundled schema against ../engine/contracts/sequence.schema.json, i.e.
      # it needs an engine checkout pinned to the release you target. Run it
      # locally as part of the release checklist.
      - run: npm run check
      - name: Package .vsix
        run: npm run package
